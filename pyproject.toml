[project]
name = "pharmakon-workspace"
version = "0.0.0"
requires-python = ">=3.11"
dependencies = ["pharmakon-core[rdkit]"]

[tool.uv]
package = false

[tool.uv.sources]
pharmakon-core = { workspace = true }

[tool.uv.workspace]
members = ["packages/*", "servers/*"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.17.4", "pyright[nodejs]>=1.1.414", "pre-commit>=3.8"]

[tool.pytest.ini_options]
addopts = "--import-mode=importlib -m 'not live'"
markers = [
  "live: calls real external APIs (enable with PHARMAKON_LIVE_TESTS=1)",
  "req(id): links a test to a requirement ID",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["pharmakon_*"]

[tool.pyright]
typeCheckingMode = "standard"
pythonVersion = "3.11"
