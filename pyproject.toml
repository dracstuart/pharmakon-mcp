[project]
name = "pharmakon-workspace"
version = "0.0.0"
requires-python = ">=3.10"

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/*", "servers/*"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.17", "pyright>=1.1.380", "pre-commit>=3.8"]

[tool.pytest.ini_options]
addopts = "--import-mode=importlib -m 'not live'"
markers = [
  "live: calls real external APIs (enable with PHARMAKON_LIVE_TESTS=1)",
  "req(id): links a test to a requirement ID",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pyright]
typeCheckingMode = "standard"
pythonVersion = "3.10"
